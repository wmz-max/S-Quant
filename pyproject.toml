[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "squant-research"
version = "0.1.0"
description = "Paper-grounded S-Quant research implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
search = ["scipy>=1.11,<2", "scikit-learn>=1.4,<2"]
llm = ["torch>=2.4,<3", "transformers>=4.45,<5", "accelerate>=1,<2", "datasets>=3,<5", "safetensors>=0.4"]
eval = ["lm-eval>=0.4.5,<0.5"]
dev = ["pytest>=8,<10"]
hardware = ["yowasp-yosys>=0.60"]

[project.scripts]
squant = "squant.cli:main"

[tool.setuptools.packages.find]
include = ["squant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
